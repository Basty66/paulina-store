<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familias de Productos - Paulina Store</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #09090b; color: #fafafa; padding: 16px; }
        h1 { text-align: center; margin-bottom: 16px; color: #10b981; font-size: 1.3rem; }
        .subtitle { text-align: center; color: #71717a; font-size: 0.85rem; margin-bottom: 24px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 500px; margin: 0 auto; }
        .card { background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; padding: 16px; }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .card-num { font-size: 1.4rem; font-weight: 800; color: #10b981; }
        .card-name { font-size: 1rem; font-weight: 600; color: #fafafa; }
        .barcode-section { margin-bottom: 14px; text-align: center; }
        .barcode-section:last-of-type { margin-bottom: 0; }
        .barcode-label { font-size: 0.65rem; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; font-weight: 600; }
        .barcode-wrap { background: white; padding: 10px; border-radius: 8px; display: inline-block; max-width: 100%; overflow: hidden; }
        .barcode-wrap svg { max-width: 100%; height: auto; }
        .card .tipo { font-size: 0.6rem; color: #52525b; margin-top: 10px; text-align: center; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media print { body { background: white; color: black; padding: 10px; } .card { border-color: #ccc; page-break-inside: avoid; margin-bottom: 10px; } .card-name { color: #000; } .card-num { color: #10b981; } }
    </style>
</head>
<body>
    <h1>Familias de Productos</h1>
    <p class="subtitle">Escanea el codigo y luego el nombre para auto-completar</p>
    <div class="grid" id="grid"></div>

    <script>
        const families = [
            { code: "1001", name: "Alimentos Basicos" },
            { code: "1002", name: "Lacteos y Huevo" },
            { code: "1003", name: "Carnes y Aves" },
            { code: "1004", name: "Embutidos y Fiambres" },
            { code: "1005", name: "Pescados y Mariscos" },
            { code: "1006", name: "Frutas y Verduras" },
            { code: "1007", name: "Pan y Reposteria" },
            { code: "1008", name: "Bebidas sin Alcohol" },
            { code: "1009", name: "Bebidas Alcoholicas" },
            { code: "1010", name: "Cafe y Te" },
            { code: "1011", name: "Snacks y Dulces" },
            { code: "1012", name: "Congelados" },
            { code: "1013", name: "Conservas" },
            { code: "1014", name: "Limpieza" },
            { code: "1015", name: "Higiene Personal" },
            { code: "1016", name: "Farmacia" },
            { code: "1017", name: "Bebes" },
            { code: "1018", name: "Mascotas" },
            { code: "1019", name: "Tabaco" },
            { code: "1020", name: "Papeleria y Utensilios" }
        ];

        const grid = document.getElementById('grid');
        families.forEach((f, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML =
                '<div class="card-header">' +
                    '<div class="card-num">' + f.code + '</div>' +
                    '<div class="card-name">' + f.name + '</div>' +
                '</div>' +
                '<div class="barcode-section"><div class="barcode-label">Codigo</div><div class="barcode-wrap"><svg id="bc-code-' + i + '"></svg></div></div>' +
                '<div class="barcode-section"><div class="barcode-label">Nombre</div><div class="barcode-wrap"><svg id="bc-name-' + i + '"></svg></div></div>' +
                '<div class="tipo">TIPO FAMILIA: NO USA TECLA</div>';
            grid.appendChild(card);

            setTimeout(() => {
                try {
                    const sanitizedName = f.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
                    JsBarcode('#bc-code-' + i, f.code, { format: 'CODE128', width: 2.5, height: 80, displayValue: true, fontSize: 16, margin: 10 });
                    JsBarcode('#bc-name-' + i, sanitizedName, { format: 'CODE128', width: 2, height: 80, displayValue: true, fontSize: 14, margin: 10 });
                } catch(e) { console.log('Error barcode ' + i + ':', e); }
            }, 50 + i * 10);
        });
    </script>
</body>
</html>
