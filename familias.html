<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familias de Productos - Paulina Store</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #09090b; color: #fafafa; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #10b981; }
        .subtitle { text-align: center; color: #71717a; font-size: 0.9rem; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; padding: 20px; }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .card-num { font-size: 1.6rem; font-weight: 800; color: #10b981; }
        .card-name { font-size: 1.1rem; font-weight: 600; color: #fafafa; }
        .barcode-section { margin-bottom: 16px; }
        .barcode-section:last-child { margin-bottom: 0; }
        .barcode-label { font-size: 0.7rem; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; font-weight: 600; }
        .barcode-wrap { background: white; padding: 12px; border-radius: 8px; display: inline-block; }
        .card .tipo { font-size: 0.65rem; color: #52525b; margin-top: 12px; text-align: center; }
        @media print { body { background: white; color: black; padding: 10px; } .card { border-color: #ccc; page-break-inside: avoid; margin-bottom: 12px; } .card-name { color: #000; } .card-num { color: #10b981; } }
    </style>
</head>
<body>
    <h1>Familias de Productos</h1>
    <p class="subtitle">Escanea el codigo y luego el nombre para auto-completar</p>
    <div class="grid" id="grid"></div>

    <script>
        const families = [
            { code: "90001", name: "Alimentos Básicos" },
            { code: "90002", name: "Lácteos y Huevo" },
            { code: "90003", name: "Carnes y Aves" },
            { code: "90004", name: "Embutidos y Fiambres" },
            { code: "90005", name: "Pescados y Mariscos" },
            { code: "90006", name: "Frutas y Verduras" },
            { code: "90007", name: "Pan y Repostería" },
            { code: "90008", name: "Bebidas sin Alcohol" },
            { code: "90009", name: "Bebidas Alcohólicas" },
            { code: "90010", name: "Café y Té" },
            { code: "90011", name: "Snacks y Dulces" },
            { code: "90012", name: "Congelados" },
            { code: "90013", name: "Conservas" },
            { code: "90014", name: "Limpieza" },
            { code: "90015", name: "Higiene Personal" },
            { code: "90016", name: "Farmacia" },
            { code: "90017", name: "Bebés" },
            { code: "90018", name: "Mascotas" },
            { code: "90019", name: "Tabaco" },
            { code: "90020", name: "Papelería y Utensilios" }
        ];

        const grid = document.getElementById('grid');
        families.forEach((f, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML =
                '<div class="card-header">' +
                    '<div class="card-num">' + f.code + '</div>' +
                    '<div class="card-name">' + f.name + '</div>' +
                '</div>' +
                '<div class="barcode-section"><div class="barcode-label">Codigo</div><div class="barcode-wrap"><svg id="bc-code-' + i + '"></svg></div></div>' +
                '<div class="barcode-section"><div class="barcode-label">Nombre</div><div class="barcode-wrap"><svg id="bc-name-' + i + '"></svg></div></div>' +
                '<div class="tipo">TIPO FAMILIA: NO USA TECLA</div>';
            grid.appendChild(card);

            setTimeout(() => {
                try {
                    const sanitizedName = f.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
                    JsBarcode('#bc-code-' + i, f.code, { format: 'CODE128', width: 2, height: 70, displayValue: true, fontSize: 16, margin: 8 });
                    JsBarcode('#bc-name-' + i, sanitizedName, { format: 'CODE128', width: 1.5, height: 70, displayValue: true, fontSize: 12, margin: 8, textMargin: 4 });
                } catch(e) { console.log('Error barcode ' + i + ':', e); }
            }, 50 + i * 10);
        });
    </script>
</body>
</html>
