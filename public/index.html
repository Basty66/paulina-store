<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paulina Store - Generador de Códigos</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #e94560;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #e94560;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            background: #0f3460;
            color: #fff;
        }

        .tab-btn.active {
            background: #e94560;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .tab-content.active {
            display: block;
        }

        .card-title {
            font-size: 1.3rem;
            color: #e94560;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e94560;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 1rem;
            background: #1a1a2e;
            color: #fff;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #e94560;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn:hover { transform: translateY(-2px); }

        .btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894 0%, #00a381 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #fdcb6e 0%, #e17055 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #d63031 0%, #b71c1c 100%);
            color: white;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .barcode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .barcode-card {
            background: #fff;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            color: #000;
        }

        .barcode-card h4 {
            margin-bottom: 10px;
            color: #333;
            font-size: 0.9rem;
        }

        .barcode-card .codes {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .barcode-card .code-section {
            text-align: center;
        }

        .barcode-card .code-section small {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 0.75rem;
        }

        .barcode-card .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e94560;
            margin-top: 10px;
        }

        .scanner-container {
            max-width: 500px;
            margin: 0 auto;
        }

        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }

        .scan-result {
            background: #0f3460;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .scan-result h3 {
            color: #e94560;
            margin-bottom: 15px;
        }

        .scan-result .field {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }

        .scan-result .field-label {
            color: #aaa;
        }

        .scan-result .field-value {
            color: #fff;
            font-weight: 500;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 1rem;
            background: #1a1a2e;
            color: #fff;
        }

        .table-container {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #e94560;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        tbody tr:hover {
            background: rgba(233, 69, 96, 0.1);
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .form-row { grid-template-columns: 1fr; }
        }

        .stat-box {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e94560;
        }

        .stat-box h3 {
            font-size: 1.5rem;
            color: #e94560;
        }

        .stat-box p {
            color: #aaa;
            font-size: 0.85rem;
        }

        .copy-btn {
            background: #0f3460;
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .copy-btn:hover {
            background: #e94560;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: rgba(0, 184, 148, 0.2);
            border: 1px solid #00b894;
            color: #00b894;
        }

        .alert-error {
            background: rgba(214, 48, 49, 0.2);
            border: 1px solid #d63031;
            color: #d63031;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Paulina Store</h1>
            <p>Sistema de Códigos de Barras y QR</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('registro')">Registro de Producto</button>
            <button class="tab-btn" onclick="showTab('escaner')">Escanear Código</button>
            <button class="tab-btn" onclick="showTab('codigos')">Códigos Generados</button>
            <button class="tab-btn" onclick="showTab('lista')">Lista de Productos</button>
        </div>

        <!-- Tab: Registro de Producto -->
        <div id="tab-registro" class="tab-content active">
            <h2 class="card-title">Registro de Nuevo Producto</h2>
            
            <div id="alertContainer"></div>

            <form id="productForm">
                <input type="hidden" id="editId" value="">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>CÓDIGO PRODUCTO *</label>
                        <input type="text" id="codigo" required placeholder="Ej: 7802420510403" maxlength="13">
                    </div>
                    <div class="form-group">
                        <label>DESCRIPCIÓN *</label>
                        <input type="text" id="descripcion" required placeholder="Nombre del producto">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>PRECIO COMPRA</label>
                        <input type="number" id="precioCompra" placeholder="0" min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>PRECIO VENTA NORMAL *</label>
                        <input type="number" id="precioVenta" required placeholder="0" min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>PRECIO VENTA X MAYOR</label>
                        <input type="number" id="precioMayor" placeholder="0" min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>CANTIDAD X MAYOR</label>
                        <input type="number" id="cantidadMayor" placeholder="1" min="1" value="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>TIPO</label>
                        <select id="tipo">
                            <option value="UNITARIO">UNITARIO</option>
                            <option value="PESO">PESO</option>
                            <option value="PAQUETE">PAQUETE</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>DESCUENTO/RECARGO (%)</label>
                        <input type="number" id="descuento" placeholder="0" step="0.01" value="0">
                        <small style="color:#aaa">Negativo = descuento, Positivo = recargo</small>
                    </div>
                    <div class="form-group">
                        <label>FAMILIA</label>
                        <select id="familia">
                            <option value="ABARROTES">ABARROTES</option>
                            <option value="BEBIDAS">BEBIDAS</option>
                            <option value="LIMPIEZA">LIMPIEZA</option>
                            <option value="HIGIENE">HIGIENE</option>
                            <option value="LACTEOS">LACTEOS</option>
                            <option value="CARNES">CARNES</option>
                            <option value="VERDURAS">VERDURAS</option>
                            <option value="OTROS">OTROS</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>PROVEEDOR</label>
                        <select id="proveedor">
                            <option value="">Sin seleccionar</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>STOCK</label>
                        <input type="number" id="stock" placeholder="0" min="0">
                    </div>
                    <div class="form-group">
                        <label>STOCK CRÍTICO</label>
                        <input type="number" id="stockCritico" placeholder="0" min="0">
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">Agregar Producto</button>
                    <button type="button" class="btn btn-danger" onclick="clearForm()">Limpiar Formulario</button>
                </div>
            </form>
        </div>

        <!-- Tab: Escaner -->
        <div id="tab-escaner" class="tab-content">
            <h2 class="card-title">Escanear Código QR</h2>
            
            <div class="scanner-container">
                <div id="reader"></div>
                
                <div style="margin-top: 15px; text-align: center;">
                    <button class="btn btn-primary" onclick="startScanner()">Iniciar Escáner</button>
                    <button class="btn btn-danger" onclick="stopScanner()">Detener</button>
                </div>

                <div id="scanResult" class="scan-result" style="display: none;">
                    <h3>Producto Encontrado</h3>
                    <div id="scanResultContent"></div>
                    <button class="btn btn-success" style="margin-top: 15px; width: 100%;" onclick="copyToClipboard()">
                        Copiar Información
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab: Códigos Generados -->
        <div id="tab-codigos" class="tab-content">
            <h2 class="card-title">Códigos Generados</h2>
            
            <div class="toolbar">
                <input type="text" class="search-box" id="searchCodes" placeholder="Buscar producto...">
                <button class="btn btn-success btn-small" onclick="printAllBarcodes()">Imprimir Todos</button>
            </div>

            <div id="barcodeGrid" class="barcode-grid"></div>
        </div>

        <!-- Tab: Lista de Productos -->
        <div id="tab-lista" class="tab-content">
            <h2 class="card-title">Lista de Productos</h2>
            
            <div class="toolbar">
                <input type="text" class="search-box" id="searchBox" placeholder="Buscar producto...">
                <button class="btn btn-success btn-small" onclick="exportToCSV()">Exportar CSV</button>
            </div>

            <div class="table-container">
                <table id="productsTable">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descripción</th>
                            <th>P. Compra</th>
                            <th>P. Venta</th>
                            <th>P. Mayor</th>
                            <th>Familia</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de Edición -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Producto</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editFormId">
                <div class="form-group">
                    <label>Código</label>
                    <input type="text" id="editCodigo" required maxlength="13">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <input type="text" id="editDescripcion" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Precio Compra</label>
                        <input type="number" id="editPrecioCompra" min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Precio Venta</label>
                        <input type="number" id="editPrecioVenta" required min="0" step="0.01">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/productos';
        let products = [];
        let html5QrcodeScanner = null;

        // Tabs
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'codigos') {
                renderBarcodeGrid();
            }
        }

        // Alertas
        function showAlert(message, type = 'success') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        // Cargar productos
        async function loadProducts() {
            try {
                const response = await fetch(API_URL);
                products = await response.json();
                renderTable();
                renderBarcodeGrid();
                updateStats();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Formulario
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const editId = document.getElementById('editId').value;
            
            const product = {
                codigo: document.getElementById('codigo').value.trim(),
                descripcion: document.getElementById('descripcion').value.trim(),
                precioCompra: parseFloat(document.getElementById('precioCompra').value) || 0,
                precioVenta: parseFloat(document.getElementById('precioVenta').value),
                precioMayor: parseFloat(document.getElementById('precioMayor').value) || 0,
                cantidadMayor: parseInt(document.getElementById('cantidadMayor').value) || 1,
                tipo: document.getElementById('tipo').value,
                descuento: parseFloat(document.getElementById('descuento').value) || 0,
                familia: document.getElementById('familia').value,
                proveedor: document.getElementById('proveedor').value,
                stock: parseInt(document.getElementById('stock').value) || 0,
                stockCritico: parseInt(document.getElementById('stockCritico').value) || 0
            };

            try {
                let response;
                if (editId) {
                    response = await fetch(`${API_URL}/${editId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(product)
                    });
                } else {
                    if (products.some(p => p.codigo === product.codigo)) {
                        showAlert('Este código ya existe', 'error');
                        return;
                    }
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(product)
                    });
                }

                if (response.ok) {
                    showAlert(editId ? 'Producto actualizado' : 'Producto agregado');
                    this.reset();
                    document.getElementById('editId').value = '';
                    await loadProducts();
                } else {
                    showAlert('Error al guardar', 'error');
                }
            } catch (error) {
                showAlert('Error de conexión', 'error');
            }
        });

        // Renderizar tabla
        function renderTable(filter = '') {
            const tbody = document.getElementById('productsBody');
            
            let filtered = products;
            if (filter) {
                const f = filter.toLowerCase();
                filtered = products.filter(p => 
                    p.descripcion?.toLowerCase().includes(f) ||
                    p.codigo?.includes(f) ||
                    p.familia?.toLowerCase().includes(f)
                );
            }

            tbody.innerHTML = filtered.map(p => `
                <tr>
                    <td><strong>${p.codigo}</strong></td>
                    <td>${p.descripcion}</td>
                    <td>$${parseFloat(p.precio_compra || 0).toLocaleString()}</td>
                    <td>$${parseFloat(p.precio_venta).toLocaleString()}</td>
                    <td>$${parseFloat(p.precio_mayor || 0).toLocaleString()}</td>
                    <td>${p.familia || '-'}</td>
                    <td>${p.stock || 0}</td>
                    <td class="actions">
                        <button class="btn btn-warning btn-small" onclick='editProduct(${JSON.stringify(p)})'>Editar</button>
                        <button class="btn btn-danger btn-small" onclick="deleteProduct(${p.id})">Eliminar</button>
                    </td>
                </tr>
            `).join('');
        }

        // Renderizar grid de códigos
        function renderBarcodeGrid(filter = '') {
            const grid = document.getElementById('barcodeGrid');
            
            let filtered = products;
            if (filter) {
                const f = filter.toLowerCase();
                filtered = products.filter(p => 
                    p.descripcion?.toLowerCase().includes(f) ||
                    p.codigo?.includes(f)
                );
            }

            grid.innerHTML = filtered.map(p => `
                <div class="barcode-card">
                    <h4>${p.descripcion}</h4>
                    <div class="codes">
                        <div class="code-section">
                            <svg class="barcode-img" data-code="${p.codigo}"></svg>
                            <small>EAN-13</small>
                        </div>
                        <div class="code-section">
                            <canvas class="qr-code" data-product='${JSON.stringify(p).replace(/'/g, "&#39;")}'></canvas>
                            <small>QR Info</small>
                        </div>
                    </div>
                    <div class="price">$${parseFloat(p.precio_venta).toLocaleString()}</div>
                </div>
            `).join('');

            // Generar barcodes
            document.querySelectorAll('.barcode-img').forEach(el => {
                const code = el.getAttribute('data-code');
                try {
                    JsBarcode(el, code, {
                        format: "EAN13",
                        width: 1.5,
                        height: 40,
                        displayValue: true,
                        fontSize: 10,
                        margin: 5
                    });
                } catch (e) {
                    JsBarcode(el, code, {
                        format: "CODE128",
                        width: 1.5,
                        height: 40,
                        displayValue: true,
                        fontSize: 10,
                        margin: 5
                    });
                }
            });

            // Generar QR codes
            document.querySelectorAll('.qr-code').forEach(canvas => {
                const productData = canvas.getAttribute('data-product');
                try {
                    const data = JSON.parse(productData);
                    const qrData = JSON.stringify({
                        Codigo: data.codigo,
                        Descripcion: data.descripcion,
                        PrecioCompra: data.precio_compra || 0,
                        PrecioVenta: data.precio_venta,
                        PrecioMayor: data.precio_mayor || 0,
                        Tipo: data.tipo || 'UNITARIO',
                        Familia: data.familia || 'ABARROTES',
                        Stock: data.stock || 0
                    });
                    
                    QRCode.toCanvas(canvas, qrData, {
                        width: 100,
                        margin: 2,
                        color: { dark: '#000', light: '#fff' }
                    });
                } catch (e) {
                    console.error('Error QR:', e);
                }
            });
        }

        // Estadísticas
        function updateStats() {
            document.getElementById('totalProducts').textContent = products.length;
            const totalValue = products.reduce((sum, p) => sum + parseFloat(p.precio_venta || 0), 0);
            document.getElementById('totalValue').textContent = '$' + totalValue.toLocaleString();
        }

        // Editar
        function editProduct(product) {
            document.getElementById('editId').value = product.id;
            document.getElementById('codigo').value = product.codigo;
            document.getElementById('descripcion').value = product.descripcion;
            document.getElementById('precioCompra').value = product.precio_compra || 0;
            document.getElementById('precioVenta').value = product.precio_venta;
            document.getElementById('precioMayor').value = product.precio_mayor || 0;
            document.getElementById('cantidadMayor').value = product.cantidad_mayor || 1;
            document.getElementById('tipo').value = product.tipo || 'UNITARIO';
            document.getElementById('descuento').value = product.descuento || 0;
            document.getElementById('familia').value = product.familia || 'ABARROTES';
            document.getElementById('proveedor').value = product.proveedor || '';
            document.getElementById('stock').value = product.stock || 0;
            document.getElementById('stockCritico').value = product.stock_critico || 0;
            
            showTab('registro');
            document.querySelector('.tab-btn').click();
        }

        // Eliminar
        async function deleteProduct(id) {
            if (confirm('¿Eliminar este producto?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                await loadProducts();
            }
        }

        // Limpiar formulario
        function clearForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editId').value = '';
        }

        // Buscar
        document.getElementById('searchBox').addEventListener('input', e => renderTable(e.target.value));
        document.getElementById('searchCodes').addEventListener('input', e => renderBarcodeGrid(e.target.value));

        // Escáner QR
        let scanner = null;

        function startScanner() {
            scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            scanner.render(onScanSuccess);
        }

        function stopScanner() {
            if (scanner) {
                scanner.clear();
                scanner = null;
            }
        }

        function onScanSuccess(decodedText) {
            try {
                const data = JSON.parse(decodedText);
                const product = products.find(p => p.codigo === data.Codigo);
                
                if (product) {
                    document.getElementById('scanResult').style.display = 'block';
                    document.getElementById('scanResultContent').innerHTML = `
                        <div class="field">
                            <span class="field-label">Código:</span>
                            <span class="field-value">${product.codigo}</span>
                        </div>
                        <div class="field">
                            <span class="field-label">Descripción:</span>
                            <span class="field-value">${product.descripcion}</span>
                        </div>
                        <div class="field">
                            <span class="field-label">Precio Compra:</span>
                            <span class="field-value">$${parseFloat(product.precio_compra || 0).toLocaleString()}</span>
                        </div>
                        <div class="field">
                            <span class="field-label">Precio Venta:</span>
                            <span class="field-value">$${parseFloat(product.precio_venta).toLocaleString()}</span>
                        </div>
                        <div class="field">
                            <span class="field-label">Precio Mayor:</span>
                            <span class="field-value">$${parseFloat(product.precio_mayor || 0).toLocaleString()}</span>
                        </div>
                        <div class="field">
                            <span class="field-label">Familia:</span>
                            <span class="field-value">${product.familia || '-'}</span>
                        </div>
                        <div class="field">
                            <span class="field-label">Stock:</span>
                            <span class="field-value">${product.stock || 0}</span>
                        </div>
                    `;
                    window.lastScannedData = product;
                } else {
                    alert('Producto no encontrado: ' + data.Codigo);
                }
            } catch (e) {
                alert('Código no válido');
            }
        }

        function copyToClipboard() {
            if (window.lastScannedData) {
                const p = window.lastScannedData;
                const text = `Código: ${p.codigo}\nDescripción: ${p.descripcion}\nPrecio Compra: ${p.precio_compra || 0}\nPrecio Venta: ${p.precio_venta}\nPrecio Mayor: ${p.precio_mayor || 0}\nFamilia: ${p.familia || ''}\nStock: ${p.stock || 0}`;
                navigator.clipboard.writeText(text);
                showAlert('Información copiada');
            }
        }

        // Imprimir todos los códigos
        function printAllBarcodes() {
            const printContent = products.map(p => `
                <div style="display: inline-block; margin: 10px; text-align: center; padding: 10px; border: 1px solid #ccc;">
                    <div style="font-weight: bold; margin-bottom: 5px;">${p.descripcion}</div>
                    <svg class="print-barcode" data-code="${p.codigo}"></svg>
                    <div>Precio: $${parseFloat(p.precio_venta).toLocaleString()}</div>
                </div>
            `).join('');

            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Códigos de Barras</title>
                    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>
                </head>
                <body>
                    <h1>Paulina Store - Códigos de Barras</h1>
                    ${printContent}
                    <script>
                        document.querySelectorAll('.print-barcode').forEach(el => {
                            const code = el.getAttribute('data-code');
                            try {
                                JsBarcode(el, code, { format: "EAN13", width: 2, height: 80, fontSize: 14, margin: 10 });
                            } catch(e) {
                                JsBarcode(el, code, { format: "CODE128", width: 2, height: 80, fontSize: 14, margin: 10 });
                            }
                        });
                        setTimeout(() => window.print(), 500);
                    <\/script>
                </body>
                </html>
            `);
        }

        // Exportar CSV
        function exportToCSV() {
            const headers = ['Código', 'Descripción', 'P. Compra', 'P. Venta', 'P. Mayor', 'Familia', 'Stock'];
            const rows = products.map(p => [
                p.codigo,
                `"${p.descripcion}"`,
                p.precio_compra || 0,
                p.precio_venta,
                p.precio_mayor || 0,
                p.familia || '',
                p.stock || 0
            ]);

            const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'productos.csv';
            a.click();
        }

        // Auto-generar código
        document.getElementById('descripcion').addEventListener('blur', function() {
            const codigoInput = document.getElementById('codigo');
            if (!codigoInput.value) {
                let code = '780';
                for (let i = 0; i < 9; i++) code += Math.floor(Math.random() * 10);
                let sum = 0;
                for (let i = 0; i < 12; i++) sum += parseInt(code[i]) * (i % 2 === 0 ? 1 : 3);
                code += (10 - (sum % 10)) % 10;
                codigoInput.value = code;
            }
        });

        // Inicializar
        loadProducts();
    </script>
</body>
</html>
